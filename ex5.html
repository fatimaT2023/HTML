
<!DOCTYPE html>
<html>
<head>
    <title>Images in Tables</title>
</head>

<body>

    <h1>Images in Tables</h1>

    <hr>

    <h3>What are your favorite pets?</h3>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a Link)</th>
        </tr>

        <tr>
            <td>
                <img src="horse.jpg" width="300" height="180">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Horse">
                    Horse
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="dog.jpg" width="300" height="180">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Dog">
                    Dogs
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="cat.jpg" width="300" height="180">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Cat">
                    Cats
                </a>
            </td>
        </tr>

    </table>

</body>
</html>
