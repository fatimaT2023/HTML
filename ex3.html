<!DOCTYPE html>
<html>
<head>
    <title>Nested Lists</title>
</head>

<body>

    <p>Preceding Text</p>

    <ol type="I">
        <li>
            Fruits
            <ol type="a">
                <li>Apple</li>
                <li>Banana</li>
            </ol>
        </li>

        <li>
            Animals
            <ol>
                <li>Cat</li>
                <li>
                    Dog
                    <ul>
                        <li>Small Dog</li>
                        <li>
                            Big Dog
                            <ul>
                                <li>German Shepherd</li>
                                <li>Golden Retriever</li>
                            </ul>
                        </li>
                        <li>White Dog</li>
                    </ul>
                </li>
                <li>Horse</li>
            </ol>
        </li>

        <li>
            Countries
            <ul>
                <li>Jordan</li>
                <li>Palestine</li>
                <li>Turkey</li>
            </ul>
        </li>
    </ol>

</body>
</html>
